# Main configuration file
defaults:
  - model: gpt2_124m
  - optimizer: adamw
  - trainer: default
  - _self_

# Seed for reproducibility
seed: null

# Experiment configuration
experiment:
  initial_weights: null

# Wandb configuration
wandb:
  project: "25-verb-overgen"
  log_model: false
  save_dir: "./logs/wandb"
  tags: []

tokenizer: "./data/tokenizer/1024-wordlevel/tokenizer.json"

# Output paths
output:
  root_dir: "./var/train/20260212"
  
trace:
  tokens_to_watch:
    - "make"

# Data loading
data:
  train:
    path: "./data/pychildes/pychildes-morphosyntax-tokenized.20251024.parquet"
    path_annotation: "./data/pychildes/pychildes-morphosyntax_annotation-20260321.20251024.parquet"
    # batch_size: 256
    shuffle: true
    shuffle_seed: null
    max_token_per_batch: 8192
    
    subset: full
    subset_seed: null
  # val:
    # path: "./data/scamp/scamp-postprocessed-tokenized.20260101.parquet"
    # batch_size: 512
  eval_overgen:
    path: "./data/testset/output/testset_llm_gen.final_postprocessed_20260114T1637.parquet"
    batch_size: 512
