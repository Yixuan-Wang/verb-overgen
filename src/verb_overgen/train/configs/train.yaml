# Main configuration file
defaults:
  - model: gpt2_115m
  - optimizer: adamw
  - trainer: default
  - data: default
  - _self_

# Seed for reproducibility
seed: null

# Experiment configuration
experiment:
  initial_weights: null

# Wandb configuration
wandb:
  project: "25-verb-overgen"
  log_model: false
  save_dir: "./logs/wandb"
  tags: []

tokenizer: "./data/tokenizer/1024-wordlevel/tokenizer.json"

# Output paths
output:
  root_dir: "./var/train/20260402"
  
trace:
  # These tokens will receive extra metrics
  # - Times encountered in the training data
  # - Overgen evaluation set run every ${trainer.log_every_n_steps}
  tokens_to_watch:
    - "${data.train.subset_verb_of_interest}"

# Data loading
data:
  train:
    path: "./data/pychildes/pychildes-morphosyntax-tokenized.20251024.parquet"
    path_annotation: "./data/pychildes/pychildes-morphosyntax_annotation-20260402.20251024.parquet"
    # batch_size: 256
    shuffle: true
    shuffle_seed: null
    max_token_per_batch: 8192
    no_child_speech: false
    
    subset: full
    subset_seed: null
    subset_verb_of_interest: "laugh"
  # val:
    # path: "./data/scamp/scamp-postprocessed-tokenized.20260101.parquet"
    # batch_size: 512
  eval_overgen:
    path: "./data/testset/output/testset_gemini.20260402T2045.parquet" 
    batch_size: 512
