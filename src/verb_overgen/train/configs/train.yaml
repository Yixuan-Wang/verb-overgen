# Main configuration file
defaults:
  - model: gpt2_124m
  - optimizer: adamw
  - trainer: default
  - _self_

# Seed for reproducibility
seed: null

# Experiment configuration
experiment:
  initial_weights: null

# Wandb configuration
wandb:
  project: "25-verb-overgen"
  log_model: false
  save_dir: "./logs/wandb"
  tags:
    - packing
    - full

tokenizer: "./data/tokenizer/1024-wordlevel/tokenizer.json"

# Output paths
output:
  root_dir: "./var/train/20260128"

# Data loading
# TODO: Add filtering to the logic.
data:
  train:
    path: "./data/pychildes/pychildes-morphosyntax_postprocess.20260102_20251024.parquet"
    # batch_size: 256
    shuffle: true
    shuffle_seed: null
    max_token_per_batch: 1920
  val:
    path: "./data/scamp/scamp-postprocessed-tokenized.20260101.parquet"
    batch_size: 512
  test:
    path: "./data/testset/output/testset_llm_gen.final_postprocessed_20260114T1637.parquet"
    batch_size: 512
