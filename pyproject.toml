[project]
name = "verb-overgen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=6.0.0",
    "apfel",
    "einops>=0.8.1",
    "fire>=0.7.0",
    "hydra-core>=1.3.2",
    "jaxtyping>=0.3.3",
    "loguru>=0.7.3",
    "marimo>=0.18.4",
    "matplotlib>=3.10.0",
    "numpy>=2",
    "polars>=1.23.0",
    "python-dotenv>=1.0.1",
    "regex>=2024.11.6",
    "rich>=13.9.4",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "torch",
    "transformers>=4.49.0",
]

[project.optional-dependencies]
prep = ["en-core-web-trf", "nltk>=3.9.1", "spacy>=3.8.4", "supar"]
train = [
    "protobuf>=6.30.0",
    "tokenizer>=3.4.5",
    "wandb>=0.19.10",
    "lightning==2.5.*",
]
prep-sgl = [
    "ice-cup-sgl",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
supar = { git = "https://github.com/yzhangcs/parser", rev = "bebdd350e034c517cd5b71185e056503290164fa" }
torch = [
    # { index = "torch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "torch-cu128", marker = "sys_platform == 'linux'" },
]
apfel = { git = "https://github.com/Yixuan-Wang/apfel.git", tag = "v0.1.0" }
ice-cup-sgl = { git = "https://github.com/Yixuan-Wang/ice-cup.git", subdirectory = "packages/ice-cup-sgl", rev = "cb4bdec" }
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipykernel>=6.29.5",
    "ipython>=8.32.0",
    "ipywidgets>=8.1.5",
    "jupyter-server"
]
prep = [
    "pyarrow>=22.0.0",
    "ray>=2.51.1",
]

[tool.ruff]
lint.extend-select = ["ISC", "COM818"]
lint.ignore = ["E741", "F722", "F821"]
lint.flake8-implicit-str-concat.allow-multiline = false

[tool.pyright]
reportRedeclaration = false
enableTypeIgnoreComments = true

extraPaths = ["../references/PyChildes"]
